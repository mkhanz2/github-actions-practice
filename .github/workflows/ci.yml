name: CI-pipeline

on: 
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - name: setup docker [login]
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: build and push to docker hub
        run: |
          docker build -t ${{ vars.DOCKERHUB_USERNAME }}/my-html-app:latest -f Dockerfile.v1 .
          docker push ${{ vars.DOCKERHUB_USERNAME }}/my-html-app:latest
        

